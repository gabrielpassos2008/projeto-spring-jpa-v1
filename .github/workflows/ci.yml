# Build Maven, testes Java (unitários + integração web), empacotamento e e2e com Playwright (Python).
name: CI

on:
  push:
    branches: [main, master]
  pull_request: 
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build, testes unitários/integração Java e package
        # Exclui classes cujo nome contém Playwright (smoke e FrontendPlaywrightE2E em Java);
        # o e2e de navegador fica a cargo do job Python abaixo.
        run: ./mvnw -B -ntp clean package '-Dtest=!*Playwright*'

      - name: Start application (JAR)
        run: |
          nohup java -jar "target/projeto-spring-jpa-v1-0.0.1-SNAPSHOT.jar" > /tmp/spring.log 2>&1 &
          echo $! > /tmp/spring.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8080/login" > /dev/null; then
              echo "Aplicação respondeu em /login"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout aguardando Spring Boot"
          cat /tmp/spring.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e2e (Python) e browser Chromium
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: E2E Playwright (pytest)
        working-directory: testeE2e
        run: pytest -v
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Parar aplicação
        if: always()
        run: |
          if [ -f /tmp/spring.pid ]; then
            kill "$(cat /tmp/spring.pid)" 2>/dev/null || true
            wait "$(cat /tmp/spring.pid)" 2>/dev/null || true
          fi
